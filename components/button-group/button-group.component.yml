$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Button Group
status: stable
description: Inline flex container for a group of action buttons.

props:
  type: object
  required:
    - buttons
  properties:
    buttons:
      type: array
      title: Buttons
      description: >
        Structured button definitions rendered via the hivelog:button component.
      items:
        type: object
        required:
          - label
          - url
        properties:
          label:
            type: string
          url:
            type: string
          variant:
            type: string

libraryOverrides:
  dependencies:
    - hivelog/buttons
