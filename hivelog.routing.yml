# Full calendar page: every enabled calendar action for one apiary,
# regardless of scope (hive or apiary). Reference/management view only —
# no reporting here; reporting happens on the apiary page (apiary-scoped
# items) or each hive's page (hive-scoped items).
hivelog.apiary.calendar_action.collection:
  path: '/hivelog/apiary/{apiary}/calendar'
  defaults:
    _controller: '\Drupal\hivelog\Controller\ApiaryController::fullCalendar'
    _title_callback: '\Drupal\hivelog\Controller\ApiaryController::fullCalendarTitle'
  requirements:
    _permission: 'view own calendar action+view any calendar action+administer hivelog'
    _entity_access: 'apiary.view'
  options:
    parameters:
      apiary:
        type: entity:apiary

# Per-apiary, per-year inventory cost & depreciation report (task 0032).
# Read-side aggregation only. _entity_access added (task 0133) so this
# deeper view of one apiary's data requires the same access as the apiary
# itself, matching every other per-apiary read-only page in this file.
hivelog.apiary.inventory_cost_report:
  path: '/hivelog/apiary/{apiary}/inventory/cost-report'
  defaults:
    _controller: '\Drupal\hivelog\Controller\InventoryReportController::costReport'
    _title_callback: '\Drupal\hivelog\Controller\InventoryReportController::costReportTitle'
  requirements:
    _permission: 'view own inventory item+view any inventory item+administer hivelog'
    _entity_access: 'apiary.view'
  options:
    parameters:
      apiary:
        type: entity:apiary

# Combined financial report across every apiary the user may view (task
# 0059). Same read-side aggregation as the per-apiary report above, run
# once per viewable apiary and summed; it is the dashboard "Net YTD"
# tile's target when more than one apiary is visible. Global permission
# only, matching hivelog.apiary.inventory_cost_report. No {apiary}
# parameter to check — deliberately exempt from _entity_access (task
# 0133), since it aggregates across every apiary the caller can already
# view rather than resolving to a single one.
hivelog.apiaries.financial_report:
  path: '/hivelog/apiaries/financial-report'
  defaults:
    _controller: '\Drupal\hivelog\Controller\InventoryReportController::combinedReport'
    _title: 'Financial Report: All Apiaries'
  requirements:
    _permission: 'view own inventory item+view any inventory item+administer hivelog'

