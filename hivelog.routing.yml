# Dashboard landing page. Takes /hivelog; the apiary collection moves to
# /hivelog/apiaries. See ADR-0057 and task 0056 (criterion 1). No redirect
# from the old path — /hivelog stays valid, it just renders the dashboard.
hivelog.dashboard:
  path: '/hivelog'
  defaults:
    _controller: '\Drupal\hivelog\Controller\DashboardController::view'
    _title_callback: '\Drupal\hivelog\Controller\DashboardController::title'
  requirements:
    _permission: 'view own apiary+view any apiary+administer hivelog'

# Apiary routes.
entity.apiary.collection:
  path: '/hivelog/apiaries'
  defaults:
    _entity_list: 'apiary'
    _title: 'Apiaries'
  requirements:
    _permission: 'view own apiary+view any apiary+administer hivelog'

entity.apiary.add_form:
  path: '/hivelog/apiary/add'
  defaults:
    _entity_form: 'apiary.add'
    _title: 'Add Apiary'
  requirements:
    _permission: 'add apiary+administer hivelog'

entity.apiary.canonical:
  path: '/hivelog/apiary/{apiary}'
  defaults:
    _controller: '\Drupal\hivelog\Controller\ApiaryController::view'
    _title_callback: '\Drupal\hivelog\Controller\ApiaryController::title'
  requirements:
    _permission: 'view own apiary+view any apiary+administer hivelog'
    _entity_access: 'apiary.view'
  options:
    parameters:
      apiary:
        type: entity:apiary

entity.apiary.edit_form:
  path: '/hivelog/apiary/{apiary}/edit'
  defaults:
    _entity_form: 'apiary.edit'
    _title: 'Edit Apiary'
  requirements:
    _permission: 'edit own apiary+edit any apiary+administer hivelog'
    _entity_access: 'apiary.update'
  options:
    parameters:
      apiary:
        type: entity:apiary

entity.apiary.delete_form:
  path: '/hivelog/apiary/{apiary}/delete'
  defaults:
    _entity_form: 'apiary.delete'
    _title: 'Delete Apiary'
  requirements:
    _permission: 'delete own apiary+delete any apiary+administer hivelog'
    # 'delete_route', not 'delete' (task 0141): the route stays reachable
    # while a BLOCK row has children, so the form can render the
    # "Can't delete yet" state instead of a bare 403 — the plain
    # 'delete' op (which includes the BLOCK check) still gates every
    # Delete button/tab that calls access('delete') directly.
    _entity_access: 'apiary.delete_route'
  options:
    parameters:
      apiary:
        type: entity:apiary

# Hive routes.
