    _entity_list: 'hive_action_log'
    _title: 'Hive Action Logs'
  requirements:
    _permission: 'view own hive action log+view any hive action log+administer hivelog'

# The `_custom_access` check confirms {calendar_action} belongs to the
# same apiary as {hive} — without it, a user could log against another
# apiary's calendar action by editing the URL, since {calendar_action}
# upcasts independently of {hive} (task 0133).
hivelog.hive_action_log.add:
  path: '/hivelog/hive/{hive}/calendar-action/{calendar_action}/log/add'
  defaults:
    _controller: '\Drupal\hivelog\Controller\HiveActionLogController::addForm'
    _title: 'Add Hive Action Log'
  requirements:
    _permission: 'add hive action log+administer hivelog'
    _entity_access: 'hive.update'
    _entity_create_access: 'hive_action_log'
    _custom_access: '\Drupal\hivelog\Access\CalendarActionApiaryMatchAccessCheck::access'
  options:
    parameters:
      hive:
        type: entity:hive
      calendar_action:
        type: entity:calendar_action

entity.hive_action_log.canonical:
  path: '/hivelog/hive-action-log/{hive_action_log}'
  defaults:
    _controller: '\Drupal\hivelog\Controller\HiveActionLogController::view'
