# Full calendar page: every enabled calendar action for one apiary,
# regardless of scope (hive or apiary). Reference/management view only —
# no reporting here; reporting happens on the apiary page (apiary-scoped
# items) or each hive's page (hive-scoped items).
hivelog.apiary.calendar_action.collection:
  path: '/hivelog/apiary/{apiary}/calendar'
  defaults:
    _controller: '\Drupal\hivelog\Controller\ApiaryController::fullCalendar'
    _title_callback: '\Drupal\hivelog\Controller\ApiaryController::fullCalendarTitle'
  requirements:
    _permission: 'view own calendar action+view any calendar action+administer hivelog'
  options:
    parameters:
      apiary:
        type: entity:apiary

