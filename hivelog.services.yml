services:
  logger.channel.hivelog:
    parent: logger.channel_base
    arguments: ['hivelog']

  hivelog.breadcrumb:
    class: Drupal\hivelog\Breadcrumb\HivelogBreadcrumbBuilder
    arguments: ['@entity_type.manager']
    tags:
      - { name: breadcrumb_builder, priority: 1004 }

  hivelog.app_nav_builder:
    class: Drupal\hivelog\HivelogAppNavBuilder
    arguments: ['@module_handler', '@current_route_match', '@string_translation']

  hivelog.stat_tile_builder:
    class: Drupal\hivelog\HivelogStatTileBuilder
    arguments: ['@module_handler']

  hivelog.delete_dependency_counter:
    class: Drupal\hivelog\Delete\HivelogDeleteDependencyCounter
    arguments: ['@entity_type.manager', '@entity.last_installed_schema.repository']

  hivelog.delete_dependency_executor:
    class: Drupal\hivelog\Delete\HivelogDeleteDependencyExecutor
    arguments: ['@entity_type.manager', '@entity.last_installed_schema.repository']

  hivelog.orphan_finder:
    class: Drupal\hivelog\Delete\HivelogOrphanFinder
    arguments: ['@entity_type.manager', '@entity.last_installed_schema.repository']

  hivelog.orphan_fixer:
    class: Drupal\hivelog\Delete\HivelogOrphanFixer
    arguments: ['@entity_type.manager', '@hivelog.orphan_finder', '@hivelog.delete_dependency_executor', '@logger.channel.hivelog']
