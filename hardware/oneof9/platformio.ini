; PlatformIO project for the pilot weight-sensor node (task 0079).
;
; Board: ESP32-WROOM-32U DevKitC V4 (the exact board ordered — see task
; 0079's procurement list). Battery/solar powered — see the oneof9
; README section for the required power-LED removal, which is a hardware
; step, not something this firmware can do.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711 @ ^0.7.5
    sandeepmistry/LoRa @ ^0.8.0
