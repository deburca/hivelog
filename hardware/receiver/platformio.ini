; PlatformIO project for the pilot's receiver node (task 0079).
;
; Any ESP32/Arduino board with WiFi works here (the task's parts list
; reuses a second ESP32-WROOM-32U DevKitC V4 from the same two-pack
; bought for the sensor node). Mains-powered, sited near the house/
; router — no battery/solar build needed for this one.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.0
board_build.filesystem = littlefs
