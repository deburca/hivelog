services:
  nanoprobe.sensor_panel_builder:
    class: Drupal\nanoprobe\SensorPanelBuilder
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@datetime.time'
      - '@date.formatter'
      - '@string_translation'
  nanoprobe.sensor_alert_collector:
    class: Drupal\nanoprobe\SensorAlertCollector
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@date.formatter'
      - '@string_translation'
