# Sensor device permissions. `add sensor device` re-added (task 0135) —
# task 0106 had removed it as dead config, matching ApiClient/
# AiProviderConfig's "rare, high-trust, administrator-provisioned"
# reasoning, but 0135 revisited that call specifically for hardware a
# beekeeper manages day-to-day on their own hive/apiary (unlike an API
# credential or AI provider integration, which stay admin-only). Scoped
# the same way `add hive` is: this permission alone is not enough on
# its own — the two contextual add routes
# (`nanoprobe.sensor_device.add_for_hive`/`_apiary`) also require
# `hive.update`/`apiary.update` on the target, and the context-free
# `entity.sensor_device.add_form` stays `administer hivelog` only (no
# hive/apiary in that URL to scope against — mirrors Hive itself having
# no context-free add route at all).
add sensor device:
  title: 'Add sensor devices'
view own sensor device:
  title: 'View own sensor devices'
view any sensor device:
  title: 'View any sensor device'
edit own sensor device:
  title: 'Edit own sensor devices'
edit any sensor device:
  title: 'Edit any sensor device'
delete own sensor device:
  title: 'Delete own sensor devices'
delete any sensor device:
  title: 'Delete any sensor device'

# Sensor reading permissions.
view own sensor reading:
  title: 'View own sensor readings'
view any sensor reading:
  title: 'View any sensor reading'
delete own sensor reading:
  title: 'Delete own sensor reading records'
delete any sensor reading:
  title: 'Delete any sensor reading record'
