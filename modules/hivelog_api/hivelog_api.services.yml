services:
  hivelog_api.resources:
    class: Drupal\hivelog_api\HivelogApiResources
    arguments: ['@extension.list.module', '%jsonapi.base_path%']

  # Maps the versioned /hivelog/api/v1 prefix onto core JSON:API routes (and
  # their generated links back), for allow-listed resource types only.
  hivelog_api.path_processor:
    class: Drupal\hivelog_api\PathProcessor\HivelogApiPathProcessor
    arguments: ['@hivelog_api.resources', '@request_stack', '%jsonapi.base_path%']
    tags:
      - { name: path_processor_inbound, priority: 300 }
      - { name: path_processor_outbound, priority: 50 }

  # Lets writes through on the versioned prefix even when JSON:API's site-wide
  # read-only mode is on, without changing that setting for anything else.
  hivelog_api.core_method_filter:
    class: Drupal\Core\Routing\MethodFilter
    public: false

  hivelog_api.method_filter:
    class: Drupal\hivelog_api\Routing\HivelogApiMethodFilter
    decorates: method_filter
    decoration_priority: -10
    arguments: ['@hivelog_api.method_filter.inner', '@hivelog_api.core_method_filter']
    public: false

  # Keeps a field-app token on the versioned API, away from the rest of /jsonapi.
  hivelog_api.token_confinement:
    class: Drupal\hivelog_api\EventSubscriber\HivelogApiTokenConfinementSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }

  # Resolves {hive} in a computed-view route by UUID, the id an API client has.
  hivelog_api.uuid_param_converter:
    class: Drupal\hivelog_api\ParamConverter\HivelogApiUuidParamConverter
    arguments: ['@entity_type.manager']
    tags:
      - { name: paramconverter }

  # A request with no credentials on the versioned API is a 401, not a 403.
  hivelog_api.challenge:
    class: Drupal\hivelog_api\EventSubscriber\HivelogApiChallengeSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }

  # Lets a write use the content types a shared host's firewall allows (task 0212).
  hivelog_api.write_compatibility:
    class: Drupal\hivelog_api\EventSubscriber\HivelogApiWriteCompatibilitySubscriber
    tags:
      - { name: event_subscriber }

  # Gives core's upload handling the file of a relabelled multipart upload.
  hivelog_api.input_stream_file_writer:
    class: Drupal\hivelog_api\Upload\HivelogApiInputStreamFileWriter
    decorates: file.input_stream_file_writer
    arguments: ['@hivelog_api.input_stream_file_writer.inner', '@request_stack']
    public: false

  # Narrows the API's access-checked collection queries to viewable records.
  hivelog_api.query_access:
    class: Drupal\hivelog_api\HivelogApiQueryAccess
    arguments: ['@entity_type.manager', '@current_user', '@request_stack']
