# API Client context-read endpoint — task 0090, rescoped by task 0101.
# Per docs/project-management/decisions/0100-nexus-in-process-ai-synthesis.md
# §1/§4: the insight write-back route this file used to carry is retired
# outright — `nexus` writes `HiveInsight` in-process instead. This route
# carries `_access: 'TRUE'` — no Drupal permission gate and no session
# CSRF token — the caller is a stateless, credentialed external client,
# authenticated by ApiClientApiController's own bearer-token check,
# exactly mirroring nanoprobe.sensor_reading.ingest's pattern.
collective.api_client.context:
  path: '/hivelog/api/collective/context'
  defaults:
    _controller: '\Drupal\collective\Controller\ApiClientApiController::contexts'
  requirements:
    _access: 'TRUE'
  methods: [GET]

# API Client management UI — task 0091, rescoped by task 0101. Route-level
# requirements are flat own/any/admin permissions, matching every other
# custom hivelog route; the real per-entity check happens inside the
# controller/forms. add_form is administer-hivelog-only — no "add api
# client" permission exists at all (task 0089's own deliberate design: a
# rare, high-trust credential, not something every beekeeper self-serves).
# edit/delete/regenerate-token dropped their "own" clause (task 0135) —
# `edit own`/`delete own api client` no longer exist; view keeps its "own"
# clause since `view own api client` stays (see collective.permissions.yml).
entity.api_client.collection:
  path: '/hivelog/api-clients'
  defaults:
    _entity_list: 'api_client'
    _title: 'API Clients'
  requirements:
    _permission: 'view own api client+view any api client+administer hivelog'

entity.api_client.add_form:
  path: '/hivelog/api-client/add'
  defaults:
    _entity_form: 'api_client.add'
    _title: 'Add API Client'
  requirements:
    _permission: 'administer hivelog'

entity.api_client.canonical:
  path: '/hivelog/api-client/{api_client}'
  defaults:
    _controller: '\Drupal\collective\Controller\ApiClientController::view'
    _title_callback: '\Drupal\collective\Controller\ApiClientController::title'
  requirements:
    _permission: 'view own api client+view any api client+administer hivelog'
    _entity_access: 'api_client.view'
  options:
    parameters:
      api_client:
        type: entity:api_client

entity.api_client.edit_form:
  path: '/hivelog/api-client/{api_client}/edit'
  defaults:
    _entity_form: 'api_client.edit'
    _title: 'Edit API Client'
  requirements:
    _permission: 'edit any api client+administer hivelog'
    _entity_access: 'api_client.update'
  options:
    parameters:
      api_client:
        type: entity:api_client

entity.api_client.delete_form:
  path: '/hivelog/api-client/{api_client}/delete'
  defaults:
    _entity_form: 'api_client.delete'
    _title: 'Delete API Client'
  requirements:
    _permission: 'delete any api client+administer hivelog'
    _entity_access: 'api_client.delete'
  options:
    parameters:
      api_client:
        type: entity:api_client

collective.api_client.regenerate_token:
  path: '/hivelog/api-client/{api_client}/regenerate-token'
  defaults:
    _form: '\Drupal\collective\Form\ApiClientRegenerateTokenForm'
    _title: 'Regenerate Token'
  requirements:
    _permission: 'edit any api client+administer hivelog'
    _entity_access: 'api_client.update'
  options:
    parameters:
      api_client:
        type: entity:api_client
