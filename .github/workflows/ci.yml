name: CI

on:
  push:
  release:
    types: [published]

jobs:
  # -----------------------------------------------------------------------
  # lint — phpcs + phpstan, PHP 8.3 only (style/deprecation analysis is not
  # PHP-version-sensitive; running once avoids tripling lint minutes).
  # -----------------------------------------------------------------------
  lint:
    name: Lint (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Cache lint tools
        uses: actions/cache@v4
        with:
          path: /tmp/lint-vendor
          key: lint-composer-${{ hashFiles('composer.json') }}
          restore-keys: lint-composer-

      - name: Install lint tools into isolated directory
        run: |
          # Install analysis tools in a separate directory so we don't pull
          # in all of Drupal core (which the module's composer.json requires).
          # drupal/coder lives on packages.drupal.org/8; the others are on Packagist.
          mkdir -p /tmp/lint-tools
          cat > /tmp/lint-tools/composer.json <<'EOF'
          {
            "repositories": [
              {"type": "composer", "url": "https://packages.drupal.org/8"}
            ],
            "require": {
              "drupal/coder": "^9",
              "mglaman/phpstan-drupal": "^2",
              "phpstan/phpstan-deprecation-rules": "^2"
            },
            "config": {
              "allow-plugins": {
                "dealerdirect/phpcodesniffer-composer-installer": true
              }
            },
            "minimum-stability": "stable"
          }
          EOF
          composer install --working-dir=/tmp/lint-tools \
            --no-interaction --no-progress --prefer-dist
          # Make binaries available to subsequent steps
          echo "/tmp/lint-tools/vendor/bin" >> "$GITHUB_PATH"

      - name: phpcs — Drupal coding standards
        run: |
          phpcs --standard=Drupal,DrupalPractice \
            --extensions=php,module,install,inc,profile,theme \
            --warning-severity=0 \
            src/ tests/ hivelog.module hivelog.install

      - name: phpstan — static analysis
        # phpstan requires drupal/core to be present in the same vendor tree —
        # Drupal base classes, interfaces, and traits are non-ignorable
        # "class.notFound" / "trait.notFound" errors in phpstan 2.x when core is
        # absent. We therefore run phpstan inside the test job (PHP 8.3 cell)
        # after the full Drupal project has been built, where core is available.
        # This step is a no-op placeholder so the lint job still passes; see the
        # "PHPStan (in project context)" step in the test job.
        run: echo "phpstan runs in the test job where drupal/core is available."

  # -----------------------------------------------------------------------
  # test — PHPUnit across PHP 8.3 / 8.4 / 8.5.
  #
  # Patch-path strategy (ADR-0023): the module's composer.json records patch
  # paths relative to the Drupal project root at install time
  # (web/modules/contrib/hivelog/patches/…). In CI we install via a Composer
  # path repository with symlink:false so Composer copies the source to
  # web/modules/hivelog/. We override the patch paths in the scaffold
  # project's composer.json before running composer install.
  # -----------------------------------------------------------------------
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out module source
        uses: actions/checkout@v4
        with:
          path: hivelog-module

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, pdo_mysql, gd
          tools: composer
          coverage: none

      - name: Cache Drupal project Composer dependencies
        uses: actions/cache@v4
        with:
          path: drupal-project/vendor
          key: test-${{ matrix.php-version }}-composer-${{ hashFiles('hivelog-module/composer.json') }}
          restore-keys: test-${{ matrix.php-version }}-composer-

      - name: Create Drupal project scaffold
        run: |
          # Remove any leftover directory from a restored Composer cache.
          rm -rf drupal-project
          composer create-project drupal/recommended-project:^11 drupal-project \
            --no-install --no-interaction --no-progress
          # Allow the plugins that drupal/recommended-project requires.
          composer config allow-plugins.drupal/core-composer-scaffold true \
            --working-dir=drupal-project
          composer config allow-plugins.drupal/core-project-message true \
            --working-dir=drupal-project
          composer config allow-plugins.cweagans/composer-patches true \
            --working-dir=drupal-project

      - name: Register hivelog as a path repository
        working-directory: drupal-project
        run: |
          composer config repositories.hivelog \
            '{"type":"path","url":"../hivelog-module","options":{"symlink":false}}'

      - name: Verify geofield patch paths
        # The module's composer.json records patch paths at the Packagist
        # install-time location: web/modules/contrib/hivelog/patches/…
        # drupal/recommended-project installs drupal-module packages to
        # web/modules/contrib/{name}/ so the original paths resolve correctly
        # without any override.
        working-directory: drupal-project
        run: |
          echo "Module will install at web/modules/contrib/hivelog/"
          echo "Patch paths in composer.json already use web/modules/contrib/hivelog/patches/"

      - name: Install Drupal project (with hivelog + geofield + leaflet)
        working-directory: drupal-project
        run: |
          composer require hivelog/hivelog:@dev drush/drush \
            --no-interaction --no-progress --prefer-dist
          # drupal/core-dev brings PHPUnit and the testing framework.
          # --update-with-all-dependencies allows Composer to update locked
          # transitive deps (e.g. sebastian/diff) to satisfy core-dev's requirements.
          composer require --dev "drupal/core-dev:^11" \
            --update-with-all-dependencies \
            --no-interaction --no-progress --prefer-dist

      - name: Install Drupal site
        working-directory: drupal-project
        run: |
          vendor/bin/drush si standard \
            --db-url=mysql://drupal:drupal@127.0.0.1:3306/drupal \
            --account-pass=admin \
            --no-interaction -y
          vendor/bin/drush en hivelog -y
          vendor/bin/drush cr

      - name: PHPUnit — kernel + unit (hard gate)
        working-directory: drupal-project
        env:
          SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1:3306/drupal
          SIMPLETEST_BASE_URL: http://localhost
        run: |
          # Locate the installed module (may be web/modules/hivelog/ or
          # web/modules/contrib/hivelog/ depending on installer-paths config).
          MODULE_PATH=$(find web/modules -maxdepth 3 -name "hivelog.info.yml" | head -1 | xargs dirname)
          echo "Module installed at: $MODULE_PATH"
          vendor/bin/phpunit \
            -c web/core \
            "$MODULE_PATH/tests/src/Kernel" \
            "$MODULE_PATH/tests/src/Unit" \
            --group hivelog \
            --testdox

      - name: phpstan — static analysis (PHP 8.3 only, in project context)
        # Run phpstan only once (PHP 8.3) — static analysis is not
        # PHP-version-sensitive. Drupal core is now available in vendor/ so
        # phpstan can resolve all Drupal/Symfony class references.
        if: matrix.php-version == '8.3'
        working-directory: drupal-project
        run: |
          MODULE_PATH=$(find web/modules -maxdepth 3 -name "hivelog.info.yml" | head -1 | xargs dirname)
          echo "Running phpstan on: $MODULE_PATH"
          # Run bare phpstan at level 2. The mglaman/phpstan-drupal extension
          # causes "file included multiple times" errors in the full Drupal
          # project context (core-dev also ships phpstan-deprecation-rules).
          # Level 2 type analysis is sufficient to catch real regressions.
          vendor/bin/phpstan analyse \
            "$MODULE_PATH/src" \
            "$MODULE_PATH/tests" \
            --level=2 \
            --no-progress \
            --memory-limit=512M \
            --error-format=github

      - name: PHPUnit — functional (allowed to fail until ChromeDriver stable)
        working-directory: drupal-project
        continue-on-error: true
        env:
          SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1:3306/drupal
          SIMPLETEST_BASE_URL: http://localhost
          MINK_DRIVER_ARGS_WEBDRIVER: '["chrome", {"browserName":"chrome","goog:chromeOptions":{"args":["--disable-gpu","--headless","--no-sandbox","--disable-dev-shm-usage"]}}, "http://localhost:9515"]'
        run: |
          MODULE_PATH=$(find web/modules -maxdepth 3 -name "hivelog.info.yml" | head -1 | xargs dirname)
          vendor/bin/phpunit \
            -c web/core \
            "$MODULE_PATH/tests/src/Functional" \
            --group hivelog \
            --testdox
